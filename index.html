<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mrl Store Gold - Catálogo Exclusivo</title>

    <!-- TAGS DE PRÉVIA PARA COMPARTILHAMENTO (Open Graph) -->
    <meta property="og:title" content="Mrl Store Gold | Catálogo Exclusivo" />
    <meta property="og:description" content="Confira nossos produtos de alta qualidade, selecione o que deseja e peça direto pelo WhatsApp." />
    <meta property="og:image" content="https://mrlmarques.github.io/catalogo-vendas/capa.jpeg" />
    <meta property="og:url" content="https://mrlmarques.github.io/catalogo-vendas/" />
    <meta property="og:type" content="website" />

    <!-- Tailwind CSS para um design profissional e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 pb-28">

    <!-- CABEÇALHO / BANNER DA LOGOTIPO (Tema Preto e Dourado) -->
    <header class="bg-zinc-950 border-b border-amber-500/30 shadow-2xl p-3 text-center">
        <div class="max-w-md mx-auto">
            <!-- Insira a imagem do seu banner como 'banner.jpeg' no repositório -->
            <img src="banner.jpeg" alt="Mrl Store Gold" class="w-full h-auto max-h-40 object-contain rounded-xl mx-auto shadow-md border border-amber-500/20" onerror="this.style.display='none'; document.getElementById('fallback-titulo').style.display='block';">
            
            <!-- Fallback caso a imagem demore ou falhe ao carregar -->
            <div id="fallback-titulo" style="display:none;" class="py-4">
                <h1 class="text-2xl font-black tracking-wider text-amber-400">MRL STORE GOLD</h1>
                <p class="text-xs text-amber-200/70 mt-1 uppercase tracking-widest">Catálogo Exclusivo</p>
            </div>
        </div>
    </header>

    <!-- ÍCONE DE CARRINHO FLUTUANTE NO TOPO (Aparece ao selecionar produtos na Etapa 1) -->
    <div id="barra-carrinho-topo" class="hidden max-w-md mx-auto px-4 pt-3">
        <div onclick="irParaCarrinho()" class="bg-zinc-900 border border-amber-500/40 p-3.5 rounded-2xl shadow-lg flex items-center justify-between cursor-pointer hover:bg-zinc-800/80 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-lg">
                    🛒
                </div>
                <div>
                    <span id="contador-itens-topo" class="text-xs font-bold text-zinc-100 block">0 itens selecionados</span>
                    <span id="valor-total-topo" class="text-sm font-black text-amber-400">R$ 0,00</span>
                </div>
            </div>
            <div class="bg-amber-500 text-black text-xs font-black px-4 py-2 rounded-xl shadow-md shadow-amber-500/20 flex items-center gap-1">
                Ver Carrinho →
            </div>
        </div>
    </div>

    <!-- NAVEGADOR DE ABAS / CATEGORIAS (Visível apenas na Etapa 1) -->
    <nav id="barra-categorias" class="max-w-md mx-auto px-4 pt-4 overflow-x-auto whitespace-nowrap flex gap-2 no-scrollbar">
        <button onclick="filtrarCategoria('todos', this)" class="cat-btn bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-black shadow-lg shadow-amber-500/20 transition">Todos os Produtos</button>
        <button onclick="filtrarCategoria('smartwatch', this)" class="cat-btn bg-zinc-900 text-zinc-300 hover:bg-zinc-800 border border-zinc-800 px-4 py-2 rounded-xl text-xs font-bold transition">Smartwatches</button>
        <button onclick="filtrarCategoria('fone', this)" class="cat-btn bg-zinc-900 text-zinc-300 hover:bg-zinc-800 border border-zinc-800 px-4 py-2 rounded-xl text-xs font-bold transition">Fones de Ouvido</button>
        <button onclick="filtrarCategoria('computador', this)" class="cat-btn bg-zinc-900 text-zinc-300 hover:bg-zinc-800 border border-zinc-800 px-4 py-2 rounded-xl text-xs font-bold transition">Computadores</button>
    </nav>

    <!-- CONTEÚDO DAS ETAPAS -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- ETAPA 1: CATÁLOGO DE PRODUTOS -->
        <section id="etapa-catalogo" class="space-y-4">
            <div id="lista-produtos" class="space-y-3">
                <!-- Produtos injetados via JavaScript -->
            </div>
        </section>

        <!-- ETAPA 1.5: PÁGINA DO CARRINHO (NOVO) -->
        <section id="etapa-carrinho" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400">Seus Itens Selecionados</h2>
                <button onclick="voltarParaCatalogo()" class="text-xs text-zinc-400 hover:text-zinc-100 font-semibold underline">← Continuar Comprando</button>
            </div>
            
            <div id="lista-carrinho-itens" class="space-y-3">
                <!-- Itens detalhados do carrinho aparecem aqui -->
            </div>

            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center shadow-xl">
                <span class="text-xs font-bold text-zinc-400 uppercase">Total do Carrinho:</span>
                <span id="carrinho-total-geral" class="text-lg font-black text-amber-400">R$ 0,00</span>
            </div>
        </section>

        <!-- ETAPA 2: DADOS DO CLIENTE -->
        <section id="etapa-dados" class="hidden bg-zinc-900 p-6 rounded-2xl shadow-xl border border-zinc-800 space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">Informações de Contato</h2>
            
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome Completo</label>
                <input type="text" id="nome-cliente" placeholder="Ex: João da Silva" class="w-full px-3 py-3 text-sm bg-zinc-950 text-zinc-100 border border-zinc-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Telefone / WhatsApp</label>
                <input type="tel" id="fone-cliente" placeholder="Ex: (11) 99999-9999" class="w-full px-3 py-3 text-sm bg-zinc-950 text-zinc-100 border border-zinc-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Forma de Pagamento</label>
                <select id="pagamento-cliente" class="w-full px-3 py-3 text-sm bg-zinc-950 text-zinc-100 border border-zinc-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
                    <option value="" disabled selected class="text-zinc-500">Selecione a forma de pagamento</option>
                    <option value="Cartão de Crédito" class="bg-zinc-900">Cartão de Crédito</option>
                    <option value="Cartão de Débito" class="bg-zinc-900">Cartão de Débito</option>
                    <option value="Dinheiro" class="bg-zinc-900">Dinheiro</option>
                </select>
            </div>
        </section>

        <!-- ETAPA 3: REVISÃO DO PEDIDO -->
        <section id="etapa-revisao" class="hidden space-y-4">
            <div class="bg-zinc-900 p-6 rounded-2xl shadow-xl border border-zinc-800 space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 border-b border-zinc-800 pb-2">Resumo do Pedido</h2>
                
                <div class="text-xs space-y-1.5 text-zinc-300">
                    <p><strong class="text-zinc-100">Nome:</strong> <span id="resumo-nome"></span></p>
                    <p><strong class="text-zinc-100">Telefone:</strong> <span id="resumo-fone"></span></p>
                    <p><strong class="text-zinc-100">Pagamento:</strong> <span id="resumo-pagamento"></span></p>
                </div>

                <div class="border-t border-zinc-800 pt-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">Itens Selecionados</h3>
                    <div id="resumo-itens" class="space-y-2 text-xs text-zinc-300 max-h-40 overflow-y-auto">
                        <!-- Itens do carrinho listados aqui -->
                    </div>
                </div>

                <div class="border-t border-zinc-800 pt-3 flex justify-between items-center">
                    <span class="text-xs font-bold text-zinc-400 uppercase">Total a Pagar:</span>
                    <span id="resumo-total" class="text-lg font-black text-amber-400">R$ 0,00</span>
                </div>
            </div>
        </section>

    </main>

    <!-- RODAPÉ DE NAVEGAÇÃO / BOTÕES DE AÇÃO -->
    <div class="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800 p-4 shadow-2xl max-w-md mx-auto flex justify-between items-center">
        <!-- Botão Voltar -->
        <button id="btn-voltar" onclick="voltarEtapa()" class="hidden text-zinc-400 hover:text-zinc-100 px-3 py-2.5 rounded-xl font-bold text-sm transition">
            ← Voltar
        </button>

        <div id="info-rodape">
            <span class="text-xs text-zinc-400 block">Total do Pedido:</span>
            <span id="valor-total" class="text-lg font-black text-amber-400">R$ 0,00</span>
        </div>

        <!-- Botão Avançar / Enviar -->
        <button id="btn-acao" onclick="avancarEtapa()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-black px-6 py-3 rounded-xl font-black text-sm shadow-lg shadow-amber-500/20 transition flex items-center gap-2">
            Ver Carrinho →
        </button>
    </div>

    <script>
        const numeroWhatsApp = "5512991421077";
        let etapaAtual = 1; // 1: Catálogo | 1.5: Carrinho | 2: Dados | 3: Revisão
        let categoriaAtiva = 'todos';

        const produtos = [
            { 
                id: 1, 
                categoria: "fone",
                nome: "🎧 Fone de Ouvido Bluetooth", 
                preco: 149.90, 
                desc: "Bluetooth 5.3, até 20h de bateria, estojo e microfone integrado.", 
                imagem: "fone.jpeg" 
            },
            { 
                id: 2, 
                categoria: "smartwatch",
                nome: "⌚ Smartwatch", 
                preco: 229.90, 
                desc: "Monitoramento cardíaco, +100 modos esportivos e notificações.", 
                imagem: "smartwatch.jpeg" 
            },
            { 
                id: 3, 
                categoria: "computador",
                nome: "💻 Notebook", 
                preco: 2899.00, 
                desc: "Processador Intel Core i5, 8GB RAM, SSD 256GB e tela Full HD.", 
                imagem: "notebook.jpeg" 
            }
        ];

        let carrinho = {};

        function filtrarCategoria(cat, elementoBtn) {
            categoriaAtiva = cat;

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-zinc-900 text-zinc-300 hover:bg-zinc-800 border border-zinc-800 px-4 py-2 rounded-xl text-xs font-bold transition";
            });
            elementoBtn.className = "cat-btn bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-black shadow-lg shadow-amber-500/20 transition";

            renderizarProdutos();
        }

        function renderizarProdutos() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';

            let produtosFiltrados = produtos.filter(prod => {
                if (categoriaAtiva === 'todos') return true;
                return prod.categoria === categoriaAtiva;
            });

            if (produtosFiltrados.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-zinc-500 py-8">Nenhum produto encontrado nesta categoria.</p>`;
                return;
            }

            produtosFiltrados.forEach(prod => {
                let qtd = carrinho[prod.id] || 0;
                
                let card = document.createElement('div');
                card.className = "bg-zinc-900 p-4 rounded-2xl shadow-xl border border-zinc-800 flex flex-col gap-3 transition hover:border-amber-500/50";
                
                card.innerHTML = `
                    <div class="flex gap-4 items-center">
                        <img src="${prod.imagem}" alt="${prod.nome}" class="w-20 h-20 object-cover rounded-xl border border-zinc-800 flex-shrink-0">
                        <div class="space-y-1 flex-grow">
                            <h3 class="font-bold text-zinc-100 text-sm">${prod.nome}</h3>
                            <p class="text-xs text-zinc-400 leading-relaxed line-clamp-2">${prod.desc}</p>
                            <span class="text-amber-400 font-bold block pt-0.5">R$ ${prod.preco.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-zinc-800">
                        <span class="text-xs text-zinc-400 font-semibold uppercase tracking-wider">Quantidade</span>
                        <div class="flex items-center gap-3">
                            <button onclick="alterarQtd(${prod.id}, -1)" class="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 rounded-xl font-bold text-zinc-300 flex items-center justify-center transition">-</button>
                            <span id="qtd-${prod.id}" class="w-6 text-center font-bold text-zinc-100">${qtd}</span>
                            <button onclick="alterarQtd(${prod.id}, 1)" class="w-8 h-8 bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 border border-amber-500/40 rounded-xl font-bold flex items-center justify-center transition">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            atualizarTotal();
        }

        function alterarQtd(id, delta) {
            if (!carrinho[id]) carrinho[id] = 0;
            carrinho[id] += delta;
            if (carrinho[id] < 0) carrinho[id] = 0;
            
            // Atualizar na tela principal se existir
            let spanQtd = document.getElementById(`qtd-${id}`);
            if (spanQtd) spanQtd.innerText = carrinho[id];

            atualizarTotal();
            
            // Se estiver na tela do carrinho, atualiza a lista dele também
            if (etapaAtual === 1.5) {
                renderizarCarrinhoPagina();
            }
        }

        function calcularTotal() {
            let total = 0;
            let totalItens = 0;
            produtos.forEach(prod => {
                let qtd = carrinho[prod.id] || 0;
                total += prod.preco * qtd;
                totalItens += qtd;
            });
            return { total, totalItens };
        }

        function atualizarTotal() {
            let res = calcularTotal();
            
            document.getElementById('valor-total').innerText = `R$ ${res.total.toFixed(2)}`;

            const barraTopo = document.getElementById('barra-carrinho-topo');
            if (res.totalItens > 0 && etapaAtual === 1) {
                barraTopo.classList.remove('hidden');
                document.getElementById('contador-itens-topo').innerText = `${res.totalItens} ${res.totalItens === 1 ? 'item selecionado' : 'itens selecionados'}`;
                document.getElementById('valor-total-topo').innerText = `R$ ${res.total.toFixed(2)}`;
            } else {
                barraTopo.classList.add('hidden');
            }
        }

        function irParaCarrinho() {
            let res = calcularTotal();
            if (res.total === 0) {
                alert("Seu carrinho está vazio.");
                return;
            }
            etapaAtual = 1.5;
            atualizarTela();
            renderizarCarrinhoPagina();
        }

        function voltarParaCatalogo() {
            etapaAtual = 1;
            atualizarTela();
        }

        function renderizarCarrinhoPagina() {
            const container = document.getElementById('lista-carrinho-itens');
            container.innerHTML = '';
            let res = calcularTotal();

            produtos.forEach(prod => {
                let qtd = carrinho[prod.id] || 0;
                if (qtd > 0) {
                    let card = document.createElement('div');
                    card.className = "bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex items-center justify-between gap-3 shadow-lg";
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${prod.imagem}" alt="${prod.nome}" class="w-14 h-14 object-cover rounded-xl border border-zinc-800">
                            <div>
                                <h4 class="font-bold text-zinc-100 text-xs">${prod.nome}</h4>
                                <span class="text-amber-400 font-bold text-xs">R$ ${(prod.preco * qtd).toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="alterarQtd(${prod.id}, -1)" class="w-7 h-7 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-zinc-300 flex items-center justify-center">-</button>
                            <span class="w-5 text-center text-xs font-bold text-zinc-100">${qtd}</span>
                            <button onclick="alterarQtd(${prod.id}, 1)" class="w-7 h-7 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-lg font-bold flex items-center justify-center">+</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });

            document.getElementById('carrinho-total-geral').innerText = `R$ ${res.total.toFixed(2)}`;
        }

        function avancarEtapa() {
            let res = calcularTotal();

            if (etapaAtual === 1) {
                if (res.total === 0) {
                    alert("Por favor, selecione pelo menos um produto antes de continuar.");
                    return;
                }
                irParaCarrinho();
            } else if (etapaAtual === 1.5) {
                if (res.total === 0) {
                    alert("Seu carrinho está vazio.");
                    voltarParaCatalogo();
                    return;
                }
                etapaAtual = 2;
                atualizarTela();
            } else if (etapaAtual === 2) {
                let nome = document.getElementById('nome-cliente').value.trim();
                let fone = document.getElementById('fone-cliente').value.trim();
                let pagamento = document.getElementById('pagamento-cliente').value;

                if (!nome) {
                    alert("Por favor, preencha o seu nome.");
                    document.getElementById('nome-cliente').focus();
                    return;
                }
                if (!fone) {
                    alert("Por favor, preencha o seu telefone.");
                    document.getElementById('fone-cliente').focus();
                    return;
                }
                if (!pagamento) {
                    alert("Por favor, selecione a forma de pagamento.");
                    document.getElementById('pagamento-cliente').focus();
                    return;
                }

                document.getElementById('resumo-nome').innerText = nome;
                document.getElementById('resumo-fone').innerText = fone;
                document.getElementById('resumo-pagamento').innerText = pagamento;
                document.getElementById('resumo-total').innerText = `R$ ${res.total.toFixed(2)}`;

                let itensHTML = '';
                produtos.forEach(prod => {
                    let qtd = carrinho[prod.id] || 0;
                    if (qtd > 0) {
                        itensHTML += `<div class="flex justify-between"><span>${qtd}x ${prod.nome}</span> <span>R$ ${(prod.preco * qtd).toFixed(2)}</span></div>`;
                    }
                });
                document.getElementById('resumo-itens').innerHTML = itensHTML;

                etapaAtual = 3;
                atualizarTela();
            } else if (etapaAtual === 3) {
                enviarParaWhatsApp();
            }
        }

        function voltarEtapa() {
            if (etapaAtual === 1.5) {
                voltarParaCatalogo();
            } else if (etapaAtual === 2) {
                irParaCarrinho();
            } else if (etapaAtual === 3) {
                etapaAtual = 2;
                atualizarTela();
            }
        }

        function atualizarTela() {
            const barraCategorias = document.getElementById('barra-categorias');
            const barraCarrinhoTopo = document.getElementById('barra-carrinho-topo');
            const secCatalogo = document.getElementById('etapa-catalogo');
            const secCarrinho = document.getElementById('etapa-carrinho');
            const secDados = document.getElementById('etapa-dados');
            const secRevisao = document.getElementById('etapa-revisao');
            const btnVoltar = document.getElementById('btn-voltar');
            const btnAcao = document.getElementById('btn-acao');
            const infoRodape = document.getElementById('info-rodape');

            secCatalogo.classList.add('hidden');
            secCarrinho.classList.add('hidden');
            secDados.classList.add('hidden');
            secRevisao.classList.add('hidden');
            btnVoltar.classList.add('hidden');
            barraCategorias.classList.add('hidden');
            barraCarrinhoTopo.classList.add('hidden');
            infoRodape.classList.remove('hidden');

            if (etapaAtual === 1) {
                secCatalogo.classList.remove('hidden');
                barraCategorias.classList.remove('hidden');
                btnAcao.innerText = "Ver Carrinho →";
                atualizarTotal();
            } else if (etapaAtual === 1.5) {
                secCarrinho.classList.remove('hidden');
                btnVoltar.classList.remove('hidden');
                btnAcao.innerText = "Informar Dados →";
            } else if (etapaAtual === 2) {
                secDados.classList.remove('hidden');
                btnVoltar.classList.remove('hidden');
                btnAcao.innerText = "Revisar Pedido →";
            } else if (etapaAtual === 3) {
                secRevisao.classList.remove('hidden');
                btnVoltar.classList.remove('hidden');
                btnAcao.innerText = "Enviar para o WhatsApp 📱";
                infoRodape.classList.add('hidden');
            }
        }

        function enviarParaWhatsApp() {
            let nome = document.getElementById('nome-cliente').value.trim();
            let fone = document.getElementById('fone-cliente').value.trim();
            let pagamento = document.getElementById('pagamento-cliente').value;
            let res = calcularTotal();

            let mensagem = `*🌟 NOVO PEDIDO - MRL STORE GOLD*%0A%0A`;
            mensagem += `*Cliente:* ${nome}%0A`;
            mensagem += `*Telefone:* ${fone}%0A`;
            mensagem += `*Pagamento:* ${pagamento}%0A%0A`;
            mensagem += `*Itens do Pedido:*%0A`;

            produtos.forEach(prod => {
                let qtd = carrinho[prod.id] || 0;
                if (qtd > 0) {
                    mensagem += `• ${qtd}x ${prod.nome} - R$ ${(prod.preco * qtd).toFixed(2)}%0A`;
                }
            });

            mensagem += `%0A*Total Geral: R$ ${res.total.toFixed(2)}*`;

            let url = `https://wa.me/${numeroWhatsApp}?text=${mensagem}`;
            window.open(url, '_blank');
        }

        renderizarProdutos();
    </script>
</body>
</html>
